<style>
:root{
  /* Palette « indigo clair » : fond blanc, accent indigo, vert émeraude (revenus), rose (dépenses), ciel (solde) */
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F5F9; --ink:#0F172A; --ink-2:#475569; --ink-3:#64748B;
  --line:#E2E8F0; --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#EEF2FF;
  --pos:#059669; --neg:#E11D48; --warn:#B45309; --warn-soft:#FEF3C7; --neg-soft:#FFE4E6; --pos-soft:#D1FAE5;--info-soft:#E0F2FE;--cadre:#CBD5E1;--autre-soft:#E9D5FF;--autre:#7C3AED;--warn-2:#D97706;
  --b-rev:#6EE7B7; --b-dep:#FDA4AF; --b-net:#A5B4FC; --b-sol:#7DD3FC;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);
  --r:14px;
  --c1:#2A78D6;--c2:#EB6834;--c3:#1BAF7A;--c4:#EDA100;--c5:#E87BA4;--c6:#008300;--c7:#4A3AA7;--c8:#E34948;--c9:#0891B2;--c10:#A16207;--c11:#BE185D;--c12:#0F766E;--c13:#7C3AED;--c14:#64748B;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0B1120;--surface:#111827;--surface-2:#1E293B;--ink:#F1F5F9;--ink-2:#CBD5E1;--ink-3:#94A3B8;--line:#1F2937;
  --accent:#818CF8;--accent-ink:#0B1120;--accent-soft:#1E1B4B;--pos:#34D399;--neg:#FB7185;--warn:#FBBF24;--warn-soft:#3A2E12;--neg-soft:#4C0519;--pos-soft:#064E3B;--info-soft:#0C4A6E;--cadre:#334155;--autre-soft:#2E1065;--autre:#A78BFA;--warn-2:#FBBF24;
  --b-rev:#047857; --b-dep:#9F1239; --b-net:#4338CA; --b-sol:#0369A1;
  --c1:#3987E5;--c2:#D95926;--c3:#199E70;--c4:#C98500;--c5:#D55181;--c6:#008300;--c7:#9085E9;--c8:#E66767;--c9:#22B8CF;--c10:#CA8A04;--c11:#EC4899;--c12:#14B8A6;--c13:#A78BFA;--c14:#94A3B8;
  --shadow:none;}
}
/* Thème « rose » (app de Marika) */
:root[data-theme="rose"]{--bg:#FFFBFD;--surface-2:#FDF2F8;--line:#F6E3EC;--cadre:#F0C6D9;--accent:#DB2777;--accent-ink:#FFFFFF;--accent-soft:#FCE7F3;
  --info-soft:#FDF2F8;--b-sol:#F9A8D4;--b-net:#F9A8D4;--b-rev:#86EFAC;--shadow:0 1px 2px rgba(157,23,77,.06),0 6px 18px rgba(219,39,119,.06)}
@media (prefers-color-scheme: dark){:root[data-theme="rose"]{--bg:#1A0F16;--surface:#22131D;--surface-2:#2E1A27;--line:#3B2232;--cadre:#4D2C41;
  --accent:#F472B6;--accent-ink:#1A0F16;--accent-soft:#4A1631;--info-soft:#3B1730;--b-sol:#9D174D;--b-net:#9D174D;--shadow:none}}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 75%);border:1px solid var(--cadre)}
.hero .gros{font-size:34px;font-weight:750;letter-spacing:-.5px;margin:2px 0}
.hero .citation{font-size:13.5px;color:var(--ink-2);font-style:italic;margin-top:8px;max-width:420px}
.hero svg{width:120px;height:auto}
@media (max-width:600px){.hero{grid-template-columns:1fr 92px}.hero svg{width:92px}.hero .gros{font-size:28px}}
.sous-onglets{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:12px}
.sous-onglets button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font:inherit;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.sous-onglets button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.bud{margin-top:4px}.bud .barre{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bud .barre i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bud .barre b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3)}
.bud .txt{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:3px}
.bud.ok i{background:var(--pos)}.bud.ko i{background:var(--neg)}.bud.ok .etat{color:var(--pos)}.bud.ko .etat{color:var(--neg)}
.btn.gros{width:100%;padding:13px;font-size:16px;border-radius:12px}
.regle-banniere{background:var(--pos-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.semaine{display:grid;grid-template-columns:110px 1fr 92px;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.semaine.cour{background:var(--accent-soft);border-radius:10px;padding:9px 8px}
.sem-det{border-left:3px solid var(--accent-soft);margin:4px 0 10px 8px;padding-left:10px;display:grid;gap:6px}
.sem-jour{padding:4px 0;border-bottom:1px dashed var(--line)}.sem-jh{display:flex;justify-content:space-between;font-size:13.5px}
.sem-tx{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13.5px;padding:3px 0;cursor:pointer}.sem-tx .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sem-add{margin-top:4px;padding:2px 8px;font-size:12px}
.semaine.sem2{grid-template-columns:1fr auto;row-gap:6px}.semaine.sem2 .sem-barre,.semaine.sem2 .sem-et{grid-column:1/-1}.semaine.sem2 .sem-et:empty{display:none}.semaine.sem2 .et{margin-top:0}
.semaine .tr{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}.semaine .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;margin-right:auto}
.mois-sel{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.mois-sel button{border:0;background:none;width:32px;height:32px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:18px}
.mois-sel button:hover{background:var(--surface-2)}
.mois-sel select{border:0;background:none;font-weight:600;padding:4px 2px;appearance:none;-webkit-appearance:none;text-align:center;cursor:pointer;max-width:160px}
nav.tabs{display:flex;gap:4px;max-width:1100px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink)}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--surface-2);color:var(--ink-2)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--neg-soft);color:var(--neg)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.two{grid-template-columns:1.2fr 1fr;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.card.clic{cursor:pointer;transition:border-color .15s}.card.clic:hover{border-color:var(--accent)!important}.chev{font-size:20px;color:var(--ink-3);line-height:1;margin-left:4px}
table.t tr.regle td{color:var(--ink-3)}
table.t td.desc{white-space:normal;min-width:120px}
.kpi.k-rev{background:var(--pos-soft);border-color:var(--b-rev)!important}.kpi.k-dep{background:var(--neg-soft);border-color:var(--b-dep)!important}.kpi.k-net{background:var(--accent-soft);border-color:var(--b-net)!important}.kpi.k-sol{background:var(--info-soft);border-color:var(--b-sol)!important}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:15px}.sec-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700}.sp-r{margin-left:auto}.sous{border-top:1px solid var(--line);padding-top:6px;margin-top:4px}.preview.total-du{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);font-weight:600;background:var(--accent-soft)}@media (max-width:600px){.t .c-type{display:none}}.preview.total-du b{margin-left:auto}
dialog section{display:flex;flex-direction:column}
.grp{border-bottom:1px solid var(--line)}.grp:last-of-type{border-bottom:0}
.grp-h{display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer}
.grp-h .main{flex:1;min-width:0}.grp-h .t1{font-weight:600}.grp-h .t2{font-size:12.5px;color:var(--ink-3)}.grp-h .amt{font-weight:600}
.chev2{display:inline-block;transition:transform .15s;color:var(--ink-3);font-size:18px;width:12px}.chev2.on{transform:rotate(90deg)}
.grp-h .chev{margin-left:4px}.pastille{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}table.t tr.tr-clic{cursor:pointer}table.t tr.tr-clic:hover td{background:var(--surface-2)}
.cal-tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.cal-tot.cal-tot4{grid-template-columns:repeat(4,1fr)}
@media (max-width:600px){.cal-tot.cal-tot4{grid-template-columns:1fr 1fr}.cal-tot.cal-tot4 div:first-child{grid-column:auto}}
.cal-tot div{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.cal-tot span{font-size:12px;color:var(--ink-2)}.cal-tot b{font-size:15px;font-weight:600}.cal-tot small{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .jsem{font-size:12px;font-weight:600;color:var(--ink-2);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .jour{min-height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;align-items:flex-end;font-size:13px}
.cal .jour.hors{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.cal .jour .n{align-self:flex-start;font-weight:600;font-size:13px;color:var(--ink)}
.cal .jour .e{font-weight:600;margin-top:2px;white-space:nowrap}.cal .jour .r{color:var(--ink-2);font-size:12px;white-space:nowrap}.cal .jour{overflow:hidden}
.cal .jour.clic{cursor:pointer}.cal .jour.clic:hover{outline:2px solid var(--cadre);outline-offset:-2px}
.cal .jour.auj .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.cal-oui{background:var(--pos-soft)}.cal-autre{background:var(--autre-soft)}.cal-non{background:var(--neg-soft)}.cal-vide{background:var(--warn-soft)}

/* calendrier des dépenses : bandes par catégorie */
.cal-tot.cal-tot2{grid-template-columns:1fr 1fr}.cal-tot.cal-tot2 div:first-child{grid-column:auto}
.cal.cal-dep .jour{align-items:stretch;min-height:76px;gap:2px}
.cal-dep .bandes{display:grid;gap:2px;margin-top:1px}
.cal-dep .bande{background:color-mix(in srgb,var(--c) 17%,var(--surface));border-left:3px solid var(--c);border-radius:4px;padding:1px 3px;display:grid;gap:1px}
.cal-dep .bl{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.cal-dep .bl .d{font-size:10px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-dep .bl .m{font-size:10px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.cal-dep .tot{margin-top:auto;align-self:flex-end;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;padding-top:2px}
@media (min-width:601px){.cal-dep .bl{flex-direction:row;justify-content:space-between;gap:4px}.cal-dep .bl .d,.cal-dep .bl .m{font-size:11px}}
@media (max-width:600px){.cal-dep .bl .d,.cal-dep .bl .m{font-size:9px}.cal-dep .bande{padding:1px 2px;border-left-width:2px}.cal-dep .tot{font-size:10.5px}}
.legend.leg-cat{flex-wrap:wrap;gap:6px 12px;margin-top:10px}.legend.leg-cat i{border-radius:3px}
/* barres empilées par catégorie (semaines, budgets) */
.tr-s{position:relative;display:flex;gap:2px;height:12px;border-radius:99px;background:var(--surface-2);overflow:visible}
.tr-s i{display:block;height:100%;border-radius:3px}.tr-s i:first-child{border-radius:99px 3px 3px 99px}.tr-s i:last-of-type{border-radius:3px 99px 99px 3px}.tr-s i:only-of-type{border-radius:99px}
.tr-s b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-3);border-radius:2px}
.tr-s.gros{height:16px;margin-top:8px}
.et{display:inline-block;font-size:11.5px;font-weight:650;border-radius:99px;padding:1px 8px;margin-top:5px}
.et.ok{background:var(--pos-soft);color:var(--pos)}.et.ko{background:var(--neg-soft);color:var(--neg)}.et.att{background:var(--warn-soft);color:var(--warn)}.et.neutre{background:var(--surface-2);color:var(--ink-3)}
/* budgets en anneaux */
.anneau{flex:none}.anneau-t{font-size:12px;font-weight:700;fill:var(--ink)}
.bres{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:12px}.bres-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.bgrille{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bcarte{display:flex;gap:12px;align-items:center;border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,var(--surface)),var(--surface) 80%);border:1px solid color-mix(in srgb,var(--c) 28%,var(--surface))}
.bc-txt{min-width:0;flex:1}.bc-nom{font-weight:650;font-size:14.5px}.bc-mt{font-size:15px;font-weight:700;margin-top:1px}.bc-mt span{font-weight:500;color:var(--ink-3);font-size:13px}
.bc-et{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}.bc-et .et{margin-top:3px}
@media (max-width:600px){.bgrille{grid-template-columns:1fr 1fr;gap:8px}.bcarte{flex-direction:column;text-align:center;gap:6px;padding:12px 8px}.bc-et{justify-content:center;flex-direction:column;gap:2px}.bc-nom{font-size:14px}.bc-mt{font-size:14px}}
/* par catégorie */
.donut-z{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;margin:2px 0 14px}.donut .dn-v{font-size:17px;font-weight:750;fill:var(--ink)}.donut .dn-s{font-size:11px;fill:var(--ink-3)}
.grp-h.ccarte{border-radius:14px;margin:6px 0;padding:8px 10px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 11%,var(--surface)),var(--surface) 85%);border:1px solid color-mix(in srgb,var(--c) 25%,var(--surface));gap:12px}
.grp-h.ccarte .t1{font-size:15px}.grp-h.ccarte .bc-et{flex-direction:row!important;justify-content:flex-start!important;gap:6px!important}.grp-h.ccarte .t2b{font-size:12.5px;color:var(--ink-3)}
.hbar{display:grid;gap:10px}
.hb-l{display:grid;grid-template-columns:112px 1fr 96px;gap:10px;align-items:center}
.hb-n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{position:relative;height:14px;background:var(--surface-2);border-radius:99px}.hb-t i{display:block;height:100%;border-radius:99px}
.hb-t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);border-radius:2px}
.hb-v{text-align:right;font-weight:700;font-size:14px;white-space:nowrap;min-width:78px}.hb-v small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
/* couple */
.cp-bloc{border-radius:14px;padding:10px 12px;margin-top:10px}
.cp-bloc.moi{background:color-mix(in srgb,var(--pos) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--pos) 25%,var(--surface))}
.cp-bloc.lui{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--surface))}
.cp-titre{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:700;font-size:15px}.cp-titre small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px}
.cp-l{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed color-mix(in srgb,var(--ink-3) 30%,transparent)}
.cp-l:first-of-type{border-top:0}.cp-l .d{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cp-l .s{font-size:12px;color:var(--ink-3)}
.cp-l .v{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}.cp-l .v small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.cp-calc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14.5px;margin-top:4px}.cp-calc .tot{font-weight:750;font-size:16px;border-top:2px solid var(--line);padding-top:6px}
.cp-ico{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
details.cp-vieux{margin-top:12px}details.cp-vieux summary{cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:600}details.cp-vieux .cp-l{opacity:.75}details.cp-vieux .cp-bloc{margin-top:8px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}.seg.seg-desc{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
@media (max-width:600px){.cal .jour{min-height:58px;padding:3px 3px;font-size:11.5px}.cal .jour .r{font-size:10.5px}.cal-tot{grid-template-columns:1fr 1fr}.cal-tot div:first-child{grid-column:1/-1}.cal .jour .e{font-size:10.5px}.cal .jour .r{font-size:10px}.cal .jour{padding:3px 3px}}
.kpi,.card.cadre{border:1px solid var(--cadre);box-shadow:none}
.card.cadre h3{font-weight:700;color:var(--ink)}
.kpi .lbl{font-size:14px;color:var(--ink);font-weight:700}
.kpi .val{font-size:22px;font-weight:400;letter-spacing:-.01em;margin-top:2px}
.kpi .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:550}

async function api(chemin, corps){
  if(window.WEB) return WEB.api(chemin, corps);
  const opt = corps ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corps)} : {};
  const r = await fetch(chemin, opt);
  let j; try { j = await r.json(); } catch(e){ throw new Error("Réponse invalide du serveur"); }
  if(!r.ok || j.erreur) throw new Error(j.erreur || ("Erreur " + r.status));
  return j;
}
let toastT;
function toast(msg, err){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; }
  // une fenêtre ouverte (showModal) passe par-dessus tout : on y place le message pour qu'il reste visible
  const dl=$("#dlg"), hote = dl && dl.open ? dl : document.body; if(t.parentNode!==hote) hote.appendChild(t); t.textContent=msg; t.className="toast on"+(err?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast"+(err?" err":""), err?5000:2200); }
async function ecrit(chemin, corps, msg){
  document.body.classList.add("loading");
  try { const r = await api(chemin, Object.assign({feuille:S.feuille}, corps)); if(msg) toast(msg); S.tend=null; await rafraichit(); planifieSync(); return r; }
  catch(e){ toast(e.message, true); throw e; }
  finally { document.body.classList.remove("loading"); }
}

// ---------------------------------------------------------------- partage des dépenses entre les deux apps
// Le partage voyage dans un lien (…/finances/#partage=…) envoyé par iMessage : la partie après « # » n'est
// jamais envoyée à un serveur. L'app qui le reçoit ajoute la part de l'autre personne à SES dépenses.
const SITE_EN_LIGNE = "https://quebec2001.github.io/finances/";
function encodePartage(o){ const b = new TextEncoder().encode(JSON.stringify(o)); let x = ""; b.forEach(c => x += String.fromCharCode(c));
  return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function decodePartage(t){
  t = String(t||"").trim(); const m = t.match(/partage=([A-Za-z0-9_-]+)/); if(m) t = m[1];
  if(!/^[A-Za-z0-9_-]{8,}$/.test(t)) throw new Error("Ce texte n'est pas un lien de partage.");
  t = t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length % 4) t += "=";
  const x = atob(t), o = JSON.parse(new TextDecoder().decode(Uint8Array.from(x, c => c.charCodeAt(0))));
  if(!o || o.v !== 1 || !Array.isArray(o.t)) throw new Error("Lien de partage invalide.");
  return o;
}
// dépenses partagées pas encore remboursées : ce mois-ci depuis le dernier règlement + mois précédents reportés
// (report automatique « Portion <mois> » non réglé → on détaille les dépenses de ce mois-là)
async function lignesAPartager(m0 = S.mois, info0 = S.info){
  const vus = new Set(), out = [];
  const finMois = cle => { const [a, mo] = cle.split("-").map(Number); return `${cle}-${String(new Date(a, mo, 0).getDate()).padStart(2,"0")}`; };
  async function parcours(m, info, profondeur){
    if(vus.has(info.feuille)) return 0; vus.add(info.feuille);
    const der = m.ligne_dernier_reglement;
    const apres = (m.transactions || []).filter(t => t.utilise && t.date && (der == null || t.ligne > der));
    let couvert = 0;
    apres.filter(t => (t.marika||0) > 0.004 && ["SP","50"].includes(semType(t.type))).forEach(t => {
      out.push({cle: info.cle, nomMois: info.nom, date: t.date, desc: t.description, part: t.marika, cat: t.categorie || "", sous: `${TYPES_COURTS[semType(t.type)]} · payé ${$$(t.deboursement)}`, ligne: t.ligne});
      couvert += t.marika; });
    apres.filter(t => (t.marika||0) < -0.004).forEach(t => couvert += t.marika);       // ce que je dois (déjà dans l'app de l'autre)
    const k = S.etat.mois.findIndex(x => x.feuille === info.feuille);
    for(const r of (m.reports || [])){
      if(r.regle || Math.abs(r.montant || 0) < 0.005) continue;
      if(r.auto){
        const prec = k > 0 ? S.etat.mois[k-1] : null;
        let sous = 0;
        if(prec && prec.canvas && profondeur < 6){ try { const mm = await api("/api/mois?f=" + encodeURIComponent(prec.feuille)); sous = await parcours(mm, prec, profondeur + 1); } catch(e){} }
        const reste = r.montant - sous;
        if(reste > 0.009) out.push({cle: prec ? prec.cle : info.cle, nomMois: prec ? prec.nom : info.nom, date: prec ? finMois(prec.cle) : `${info.cle}-01`,
          desc: `Solde reporté de ${prec ? prec.nom : "mois précédent"}`, part: reste, cat: "Autres", sous: "Montant reporté, non détaillé"});
        couvert += r.montant;
      } else if(r.montant > 0){
        out.push({cle: info.cle, nomMois: info.nom, date: `${info.cle}-01`, desc: r.libelle || "Autre montant", part: r.montant, cat: "Autres", sous: "Autre montant ajouté à la main"});
        couvert += r.montant;
      } else couvert += r.montant;
    }
    return couvert;
  }
  await parcours(m0, info0, 0);
  return out.sort((a,b) => a.date.localeCompare(b.date));
}

  ouvre(`<div class="dlg-h"><h2>Partager avec ${PART()}</h2><button type="button" class="x" data-close>✕</button></div>

     ${lignes.length ? parMois.map(g => `<div style="margin:6px 0 0"><b>${esc(g.nom)}</b>${g.cle !== S.info.cle ? `<div class="small muted">Mois précédent, pas encore remboursé</div>` : ""}</div>
       <div class="imp-liste">${g.l.map(t => `<label class="imp-l" style="grid-template-columns:auto 1fr auto;display:grid;align-items:center;gap:10px"><input type="checkbox" class="imp-c" data-i="${t.i}" checked>
        <span><b style="font-weight:550">${esc(t.desc)}</b><span class="sous-t" style="display:block;font-size:12px;color:var(--ink-3)">${dC(t.date)} · ${esc(t.sous)}</span></span>
        <b class="num">${$$(t.part)}</b></label>`).join("")}</div>`).join("") + `<div class="preview total-du"><span>Part de ${PART()}</span><b class="num" id="ptot"></b></div>`
      : `<div class="small muted">Aucune dépense partagée à envoyer : tout a été remboursé.</div>`}
     <div id="plien" style="display:none"><label class="f">Lien à envoyer<textarea id="plienT" rows="3" readonly style="font-size:12px"></textarea></label></div>

    const maj = () => { $("#ptot", d).textContent = $$(choisies().reduce((a,t)=>a+t.part,0)); d.querySelectorAll(".imp-l").forEach(x => x.classList.toggle("off", !x.querySelector(".imp-c").checked)); };

    $("#pOk", d).onclick = async () => {

      const o = {v:1, de:REG().prenom, pour:REG().partenaire, mois:S.info.cle, net: Math.round((S.mois.total_a_rembourser ? S.mois.du_net : S.mois.du_total)*100)/100,
                 t: ch.map(t => [t.date, t.desc, Math.round(t.part*100)/100, t.cat])};
      const url = SITE_EN_LIGNE + "#partage=" + encodePartage(o);
      const texte = `${REG().prenom} t'envoie ta part de ${ch.length} dépense${ch.length>1?"s":""}. Touche le lien. Si ton app est sur l'écran d'accueil : copie le lien, ouvre l'app, puis Couple (ou Dépenses › Split) › « Recevoir un partage » et colle-le.`;
      $("#plien", d).style.display = ""; $("#plienT", d).value = url;
      try { if(navigator.share){ await navigator.share({title:"Dépenses partagées", text:texte, url}); toast("Partage envoyé"); return; } } catch(e){ if(e && e.name === "AbortError") return; }
      try { await navigator.clipboard.writeText(texte + "\n" + url); toast("Lien copié : colle-le dans iMessage"); }
      catch(e){ $("#plienT", d).select(); toast("Copie le lien ci-dessous et envoie-le", false); }
    };
  });
}

async function dlgRecoitPartage(o){
  const de = esc(o.de || "?"), moi = REG().prenom;
  if(o.de === moi) return toast("Ce partage vient de ton app : ouvre-le dans l'app de " + (o.pour||"l'autre personne") + ".", true);
  // mois du fichier et dépenses déjà présentes (pour ignorer ce qui a déjà été reçu)
  const parMois = {};
  for(const t of o.t){ const k = String(t[0]).slice(0,7); (parMois[k] = parMois[k] || []).push(t); }
  const infos = {};
  for(const k of Object.keys(parMois)){
    const mo = S.etat.mois.find(x => x.cle === k);
    let mm = null; if(mo && mo.modifiable){ try { mm = await api("/api/mois?f=" + encodeURIComponent(mo.feuille)); } catch(e){} }
    infos[k] = {mo, mm};
  }
  const suffixe = ` (carte ${o.de} – à rembourser)`;
  // mois d'accueil pour les dépenses d'un mois absent ou fermé de ton fichier (ex. mois précédent pas encore remboursé)
  const cibleMo = S.etat.mois.find(x => x.cle === o.mois && x.modifiable) || (S.info.modifiable ? S.info : null) || [...S.etat.mois].reverse().find(x => x.modifiable && x.canvas);
  if(cibleMo && !infos[cibleMo.cle]){ let mm = null; try { mm = await api("/api/mois?f=" + encodeURIComponent(cibleMo.feuille)); } catch(e){} infos[cibleMo.cle] = {mo: cibleMo, mm}; }
  const dejaRecue = (mm, date, desc, part) => mm.transactions.some(t => t.utilise && t.date === date && Math.abs((t.deboursement||0) - part) < 0.005 && (t.description||"").startsWith(desc));
  const lignes = o.t.map(([date, desc, part, cat], i) => {
    let k = String(date).slice(0,7), inf = infos[k], d2 = date, desc2 = desc, etat = "", ok = true;
    if(!(inf && inf.mo && inf.mo.modifiable && inf.mm) && cibleMo && infos[cibleMo.cle].mm){
      k = cibleMo.cle; inf = infos[k]; d2 = `${k}-01`; desc2 = `${desc} (${jourMots(date)})`;
      etat = `Dépense de ${MOIS_MOTS[+date.slice(5,7)-1]} : ajoutée dans ${inf.mo.nom}`;
    }
    if(!inf || !inf.mo) { etat = "Mois absent de ton fichier (crée-le d'abord)"; ok = false; }
    else if(!inf.mo.modifiable || !inf.mm) { etat = "Mois non modifiable"; ok = false; }
    else if(dejaRecue(inf.mm, d2, desc2, part)) { etat = "Déjà reçue"; ok = false; }
    const auto = catAuto(desc), c = (auto && auto !== "Autres") ? auto : (S.etat.categories.includes(cat) ? cat : (auto || "Autres"));
    return {i, date: d2, dateOrig: date, desc: desc2, part, cat: c, k, etat, ok};
  });
  const nb = lignes.filter(l => l.ok).length;
  ouvre(`<div class="dlg-h"><h2>Dépenses partagées par ${de}</h2><button type="button" class="x" data-close>✕</button></div>
   <div class="dlg-b">
     ${o.pour && o.pour !== moi ? `<div class="banner err" style="margin:0">Ce partage était destiné à ${esc(o.pour)}.</div>` : ""}
     <p class="small" style="margin:0">Ta part de ces dépenses payées par ${de} s'ajoute au solde du couple (onglet Couple). Elle comptera dans tes dépenses une fois le solde réglé.</p>
     <div id="verif"></div>
     <div class="imp-liste">${lignes.map(l => `<div class="imp-l ${l.ok?"":"off"}" data-i="${l.i}">
        <div class="imp-r1"><input type="checkbox" class="imp-c" ${l.ok?"checked":"disabled"}><div><b style="font-weight:550">${esc(l.desc)}</b><div class="small muted">${dC(l.dateOrig)}${l.etat?` · <span class="${l.ok ? "" : "warn-t"}">${esc(l.etat)}</span>`:""}</div></div><b class="num" style="text-align:right">${$$(l.part)}</b></div>
        ${l.ok ? `<div class="imp-r2" style="grid-template-columns:1fr"><select class="imp-cat">${S.etat.categories.map(c=>`<option ${c===l.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>` : ""}
      </div>`).join("")}</div>
   </div>
   <div class="dlg-f"><span class="grow"></span><button type="button" class="btn" data-close>Fermer</button>${nb?`<button type="button" class="btn primary" id="rOk">Ajouter</button>`:""}</div>`, d => {
    const maj = () => { const n = d.querySelectorAll(".imp-c:checked").length; const b = $("#rOk", d); if(b){ b.textContent = `Ajouter ${n} dépense${n>1?"s":""}`; b.disabled = !n; }
      d.querySelectorAll(".imp-l").forEach(x => x.classList.toggle("off", !x.querySelector(".imp-c").checked));

      const base = inf.mm.total_a_rembourser ? inf.mm.du_net : inf.mm.du_total, apres = Math.round((base - ajout)*100)/100, ecart = Math.round((apres + o.net)*100)/100;
      v.innerHTML = Math.abs(ecart) < 0.01
        ? `<div class="regle-banniere">✓ <span>Après l'ajout, vos deux apps afficheront le même solde : <b>${marikaTexte(apres)}</b>.</span></div>`
        : `<div class="banner err" style="margin:0">Après l'ajout : ton app → <b>${marikaTexte(apres)}</b> ; l'app de ${de} → <b>${o.net >= 0 ? `tu lui dois ${$$(o.net)}` : `il te doit ${$$(-o.net)}`}</b>. Écart de ${$$(Math.abs(ecart))} : il manque des dépenses à partager (ex. tes dépenses partagées à envoyer à ${de}, ou un solde réglé d'un seul côté).</div>`; };
    d.querySelectorAll(".imp-c").forEach(c => c.onchange = maj); maj();
    const b = $("#rOk", d); if(!b) return;
    b.onclick = async () => {
      const groupes = {};
      d.querySelectorAll(".imp-l").forEach(x => { if(!x.querySelector(".imp-c").checked) return; const l = lignes[+x.dataset.i];
        (groupes[l.k] = groupes[l.k] || []).push({description: l.desc + suffixe, montant: String(l.part), date: l.date, type: "", categorie: x.querySelector(".imp-cat").value}); });
      b.disabled = true;
      try {
        let n = 0;
        for(const k of Object.keys(groupes)){ await ecrit("/api/transactions/lot", {feuille: infos[k].mo.feuille, transactions: groupes[k]}); n += groupes[k].length; }
        toast(`${n} dépense${n>1?"s":""} ajoutée${n>1?"s":""}`); d.close();
      } catch(e){ b.disabled = false; }
    };
  });

// ---------------------------------------------------------------- synchronisation automatique du partage (version en ligne)
// Les deux apps lisent et écrivent « Partage couple.json » (OneDrive, partagé entre vous deux) à chaque ouverture :
//  1. elles ajoutent dans leur Excel les parts publiées par l'autre (mention « carte X – à rembourser »), et retirent celles qu'il a supprimées ;
//  2. elles publient leurs propres dépenses partagées pas encore remboursées et leur solde ;
//  3. un règlement marqué d'un côté est proposé à l'autre, qui le confirme (marqueur « Solde réglé » placé dans son app).
// Une dépense modifiée change d'identifiant : l'ancienne est retirée, la nouvelle ajoutée.
const SYNC = {etat: null, maj: 0, erreur: null, enCours: null, minuteur: null,
  dispo(){ return !!(window.WEB && WEB.partage); },
  lie(){ return this.dispo() && !!WEB.partage.lien(); },
  actif(){ return this.lie() && !WEB.partage.pause(); } };
const r2 = v => Math.round((v || 0) * 100) / 100;
function idPartage(de, date, desc, part){
  let h = 0x811c9dc5; const s = `${de}|${date}|${desc}|${r2(part).toFixed(2)}`;
  for(const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}
function moisSync(){
  const l = S.etat.mois.filter(x => x.modifiable && x.canvas);
  return l.find(x => x.cle === today().slice(0, 7)) || l[l.length - 1] || null;
}
const lisMois = mo => api("/api/mois?f=" + encodeURIComponent(mo.feuille));
const recuDeja = (mm, date, desc, part) => mm.transactions.some(t => t.utilise && t.date === date && Math.abs((t.deboursement || 0) - part) < 0.005 && (t.description || "").startsWith(desc));
const trouveRecue = (mm, r) => mm.transactions.find(t => t.utilise && t.date === r.date && (t.description || "").trim() === r.desc.trim() && Math.abs((t.deboursement || 0) - r.montant) < 0.005);
// au règlement, l'app transforme « (carte X – à rembourser) » en « (carte X) » (dépense personnelle) : la part reçue est alors réglée
const trouveRecueReglee = (mm, r) => { const d2 = r.desc.replace(" – à rembourser", "").trim();
  return mm.transactions.find(t => t.utilise && t.date === r.date && (t.description || "").trim() === d2 && Math.abs((t.deboursement || 0) - r.montant) < 0.005); };
const estRegle = (mm, ligne) => mm.ligne_dernier_reglement != null && ligne <= mm.ligne_dernier_reglement;
function normPartage(j){

async function graphEpargne(el){
  el.innerHTML = `<h3>Revenus et capacité d'épargne</h3><div id="gEp"><div class="empty">Chargement…</div></div>`;
  try { if(!S.tend) S.tend = await api("/api/tendances"); } catch(e){ return; }
  const g = $("#gEp", el); if(!g || !g.isConnected) return;
  const T = S.tend; let k = T.findIndex(m=>m.feuille===S.feuille); if(k<0) k = T.length-1;
  const M = T.slice(Math.max(0,k-5), k+1).map(m=>{ const r = m.revenus||0, dep = m.total_depenses||0, net = r - dep, pl = Math.max(0, m.epargne_placee||0);
    return {nom:m.nom, lab:etiquetteMois(m), r, dep, net, pl: Math.min(pl, Math.max(net,0)), reste: Math.max(0, net - pl), taux: r>0 ? net/r : null}; });
  const n = M.length, W = Math.max(300, Math.round(g.clientWidth||600)), H = 240, pl = 44, pr = 6, pt = 22, pb = 26;
  const brut = Math.max(...M.flatMap(x=>[x.r, x.dep])) || 1, e10 = Math.pow(10, Math.floor(Math.log10(brut/4)));
  const pasY = [1,2,2.5,5,10].map(f=>f*e10).find(p=>p*4>=brut*1.04), mx = pasY*4, Y = v => H-pb-(H-pb-pt)*v/mx;
  const slot = (W-pl-pr)/n, bw = Math.max(10, Math.min(44, slot*.5));
  const kd = v => (Math.round(v/100)/10).toString().replace(".",",")+" k$";
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenus, dépenses et épargne des 6 derniers mois">`;
  for(let i=0;i<=4;i++){ const v=mx/4*i, y=Y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${kd(v)}</text>`; }
  M.forEach((x,i)=>{
    const x0 = pl+slot*i, cx = x0+slot/2, bx = cx-bw/2, sel = i===n-1;
    if(sel) s += `<rect x="${x0+1}" y="${pt-14}" width="${slot-2}" height="${H-pb-pt+14}" rx="4" fill="var(--surface-2)"/>`;
    // segments empilés (2 px d'écart) : dépenses, épargne placée, reste au compte ; total = revenus (ou dépenses si déficit)
    const segs = [[Math.min(x.dep, Math.max(x.r, x.dep)), "var(--neg)"], [x.pl, "var(--accent)"], [x.reste, "var(--pos)"]];
    let base = 0;
    segs.forEach(([v,c],j)=>{ if(v<=0) return; const y1 = Y(base+v), y0 = Y(base), h = Math.max(0, y0-y1-(base>0?2:0)); if(h>0){
      const haut = !segs.slice(j+1).some(([w])=>w>0), r = haut ? Math.min(4,h/2) : 0;
      s += haut ? `<path d="M${bx},${y0-(base>0?2:0)} V${y1+r} Q${bx},${y1} ${bx+r},${y1} H${bx+bw-r} Q${bx+bw},${y1} ${bx+bw},${y1+r} V${y0-(base>0?2:0)} Z" fill="${c}"/>`
                : `<rect x="${bx}" y="${y1}" width="${bw}" height="${h}" fill="${c}"/>`; }
      base += v; });
    if(x.r > 0 && x.dep > x.r) s += `<line x1="${bx-3}" x2="${bx+bw+3}" y1="${Y(x.r)}" y2="${Y(x.r)}" stroke="var(--ink)" stroke-width="2"/>`;
    const tTxt = x.taux==null ? "—" : Math.round(x.taux*100)+" %";
    s += `<text x="${cx}" y="${Y(Math.max(x.r,x.dep))-6}" text-anchor="middle" style="font-weight:650;fill:var(--ink-2)">${tTxt}</text>`;
    s += `<rect x="${x0}" y="${pt-14}" width="${slot}" height="${H-pt+14}" fill="transparent"><title>${esc(x.nom)}\nRevenus : ${$$(x.r)}\nDépenses (ta part) : ${$$(x.dep)}\nÉpargne placée : ${$$(x.pl)}\nReste au compte : ${$$(x.net - x.pl)}\nTaux d'épargne : ${tTxt}</title></rect>`;
    s += `<text x="${cx}" y="${H-8}" text-anchor="middle" style="font-weight:${sel?700:400}">${esc(x.lab)}</text>`;
  });
  const enCours = k===T.length-1 && n>1, F = (enCours ? M.slice(0,-1) : M).filter(x=>x.r>0);
  const moyTaux = F.length ? F.reduce((a,x)=>a+x.net,0) / F.reduce((a,x)=>a+x.r,0) : null;
  const moyEp = F.length ? F.reduce((a,x)=>a+x.net,0)/F.length : null, cour = M[n-1];
  g.innerHTML = s + `</svg><div class="legend"><span><i style="background:var(--neg)"></i>Dépenses (ta part)</span><span><i style="background:var(--accent)"></i>Épargne placée (CÉLI, CÉLIAPP…)</span><span><i style="background:var(--pos)"></i>Reste au compte</span></div>
    <div class="grid kpis" style="margin-top:10px">
      ${kpi("Taux d'épargne – " + esc(cour.nom), cour.taux==null ? "—" : pct(cour.taux), cour.r>0 ? $$(cour.net)+" épargnés sur "+$$(cour.r) : "Aucun revenu inscrit", cour.net<0?"neg":"pos")}
      ${kpi("Taux d'épargne moyen", moyTaux==null ? "—" : pct(moyTaux), F.length ? F.length+" mois complet"+(F.length>1?"s":"") : "Pas encore de mois complet")}
      ${kpi("Épargne moyenne par mois", moyEp==null ? "—" : $$(moyEp), enCours ? "mois en cours exclu" : "", moyEp!=null&&moyEp<0?"neg":"pos")}
    </div>`;
}

// split : opérations en cours (depuis le dernier règlement) et règlements du mois — app de Zach
function splitDetail(m){
  const util = m.transactions.filter(t => t.utilise), der = m.ligne_dernier_reglement;
  const apres = t => der == null || t.ligne > der, avant = t => der != null && t.ligne <= der;
  const RX_CZ = /\(carte [^()]+\)\s*$/;
  const split = util.filter(t => semType(t.type) && semType(t.type) !== "P" && (t.marika || 0) !== 0);
  const reps = m.reports || [];
  const opMoi = split.filter(t => apres(t) && t.marika > 0).map(t => ({date: t.date, desc: t.description, total: t.deboursement, part: t.marika}))
    .concat(reps.filter(r => !r.regle && r.montant > 0.004).map(r => ({date: null, desc: r.libelle || "Autre montant", total: null, part: r.montant})));
  const opLui = util.filter(t => t.a_rembourser).map(t => ({date: t.date, desc: t.description.replace(/\s*\(carte [^()]+ – à rembourser\)\s*$/, ""), total: null, part: t.deboursement}))
    .concat(split.filter(t => apres(t) && t.marika < 0).map(t => ({date: t.date, desc: t.description, total: t.deboursement, part: -t.marika})))
    .concat(reps.filter(r => !r.regle && r.montant < -0.004).map(r => ({date: null, desc: r.libelle || "Autre montant", total: null, part: -r.montant})));
  const somme = l => l.reduce((a, x) => a + (x.part || 0), 0);
  // règlements du mois (le fichier garde le dernier marqueur « Solde réglé » du mois)
  const marq = util.find(t => t.ligne === der);
  const regMoi = split.filter(t => avant(t) && t.marika > 0).map(t => t.marika)
    .concat(reps.filter(r => r.regle && (r.montant_origine || 0) > 0.004).map(r => r.montant_origine));
  const regLui = util.filter(t => avant(t) && semType(t.type) === "P" && RX_CZ.test(t.description)).map(t => t.depense || t.deboursement || 0)
    .concat(split.filter(t => avant(t) && t.marika < 0).map(t => -t.marika))
    .concat(reps.filter(r => r.regle && (r.montant_origine || 0) < -0.004).map(r => -r.montant_origine));
  const premiere = util.find(t => avant(t) && t.date);
  return {opMoi, opLui, recevoir: somme(opMoi), payer: somme(opLui), marq, premiere,
          regMoi: {n: regMoi.length, tot: regMoi.reduce((a, v) => a + v, 0)}, regLui: {n: regLui.length, tot: regLui.reduce((a, v) => a + v, 0)},
          net: m.total_a_rembourser ? m.du_net : m.du_total};
}
function netSplitTexte(v){
  if(v === null || v === undefined) return "—";
  if(Math.abs(v) < 0.005) return "Réglé — 0,00 $";
  return v > 0 ? `${PART()} te doit ${$$(v)}` : `Tu dois ${$$(-v)} à ${PART()}`;
}

        <div class="grp" style="margin-top:8px;border-top:1px solid var(--line)"><div class="grp-h" id="splitTog" role="button" tabindex="0" aria-expanded="${ouvert}">
          <div class="main"><div class="t1">Détail</div><div class="t2">Opérations en cours et règlements du mois</div></div><span class="chev" style="display:inline-block;transform:rotate(${ouvert ? 90 : 0}deg)">›</span></div></div>
        ${ouvert ? `<div id="splitDet">

          <div class="sec-h" style="margin-top:16px"><span class="sec-n">2</span><b>Règlements du mois</b></div>
          ${x.regMoi.n || x.regLui.n ? `${tabReg(`Reçus de ${PART()}`, x.regMoi)}${tabReg(`Versés à ${PART()}`, x.regLui)}
            <div class="kv" style="margin-top:8px"><div class="k total">Règlements nets du mois</div><div class="num total">${Math.abs(netReg) < 0.005 ? "0,00 $" : (netReg > 0 ? `Reçu ${$$(netReg)}` : `Versé ${$$(-netReg)}`)}</div></div>`
            : `<div class="small muted" id="splitAucun">Aucun règlement ce mois-ci.</div>`}
        </div>` : ""}
        ${S.info.modifiable ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="btnRegle">Marquer solde réglé</button><button class="btn small" id="btnSplitPart">Partager avec ${PART()}</button><button class="btn small" id="btnSplitAutres">Autres montants</button></div>` : ""}
      </div>`;
}

const TESSERACT = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
function chargeScriptUneFois(src){
  if(!window.__scripts) window.__scripts = {};
  if(!window.__scripts[src]) window.__scripts[src] = new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => { delete window.__scripts[src]; ko(new Error("Chargement impossible de l'outil de lecture (connexion Internet ?)")); }; document.head.appendChild(s); });
  return window.__scripts[src];
}
function imageVersCanvas(fichier){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(fichier), img = new Image();
    img.onload = () => {
      const k = Math.min(2, Math.max(1, 1400 / img.naturalWidth));   // largeur ≈ 1400 px : meilleure lecture
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("Image illisible : " + fichier.name)); };
    img.src = url;
  });
}
function motsTesseract(data){
  const mots = [];
  const ajoute = w => { if(w && w.text && w.text.trim() && w.bbox) mots.push({t: w.text.trim(), x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1, c: w.confidence}); };
  if(Array.isArray(data.words) && data.words.length) data.words.forEach(ajoute);
  else if(Array.isArray(data.blocks)) data.blocks.forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(ajoute))));
  if(!mots.length && data.tsv){
    data.tsv.split("\n").forEach(l => { const c = l.split("\t"); if(c[0] === "5" && c[11] && c[11].trim()) mots.push({t: c[11].trim(), x0: +c[6], y0: +c[7], x1: +c[6] + +c[8], y1: +c[7] + +c[9], c: +c[10]}); });
  }
  return mots;
}
async function lisCaptures(fichiers, etat){
  etat("Chargement de l'outil de lecture… (la première fois : 10 à 20 secondes)");
  await chargeScriptUneFois(TESSERACT);
  let pct = 0;
  const worker = await Tesseract.createWorker("fra", 1, {logger: m => { if(m.status === "recognizing text") pct = Math.round((m.progress || 0) * 100); }});
  try {
    await worker.setParameters({tessedit_pageseg_mode: "11"});
    const images = [];
    for(let i = 0; i < fichiers.length; i++){
      const c = await imageVersCanvas(fichiers[i]);
      etat(`Lecture de la capture ${i + 1} sur ${fichiers.length}…`);
      const {data} = await worker.recognize(c, {}, {blocks: true, tsv: true});
      images.push({largeur: c.width, hauteur: c.height, mots: motsTesseract(data)});
    }
    return images;
  } finally { try { await worker.terminate(); } catch(e){} }
}

function catAuto(desc){
  if(!desc || !desc.trim()) return "";
  const d = desc.toLowerCase(); let r = "Autres";
  for(const k of S.etat.motscles){ if(k.mot && d.includes(k.mot.toLowerCase())) r = k.categorie; }
  return r;
}
function evalMontant(txt){
  let t = String(txt||"").replace(/\s|\$/g,"").replace(/^=/,"").replace(/,/g,".");
  if(!t) return null;
  if(!/^[\d.+\-*/()]+$/.test(t)) return NaN;
  try { const v = Function(`"use strict";return (${t})`)(); return typeof v==="number" && isFinite(v) ? v : NaN; } catch(e){ return NaN; }
}

function joursDePaye(an, mo){

  return out;
}

       <label class="f" id="iChamp" style="margin:0">${LIB}<input name="investi" inputmode="decimal" value="${esc(v2(x.investi))}" autocomplete="off"></label>

// ---------------------------------------------------------------- graphiques
const ABR_MOIS = {janvier:"Jan",février:"Fév",mars:"Mar",avril:"Avr",mai:"Mai",juin:"Juin",juillet:"Juil",août:"Aoû",septembre:"Sep",octobre:"Oct",novembre:"Nov",décembre:"Déc"};
const etiquetteMois = m => (ABR_MOIS[m.nom.split(" ")[0].toLowerCase()] || m.nom.slice(0,3)) + " " + m.cle.slice(2,4);
function graphLignes(cible, T, defs){
    const W=Math.max(320, Math.round(cible.clientWidth||640)),H=250,pl=56,pb=26,pt=10, etiquette = etiquetteMois;
    const vals = defs.flatMap(d=>T.map(d.f).filter(v=>v!==null&&v!==undefined));
    if(!vals.length){ cible.innerHTML = `<div class="empty">Aucune donnée.</div>`; return; }
    let mn=Math.min(0,...vals), mx=Math.max(...vals); if(mx===mn) mx=mn+1; const pad=(mx-mn)*.08; mn-=mn<0?pad:0; mx+=pad;
    const X=i=>pl+(W-pl-12)*(T.length===1?.5:i/(T.length-1)), Y=v=>H-pb-(H-pb-pt)*(v-mn)/(mx-mn);
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
    for(let k=0;k<=4;k++){ const v=mn+(mx-mn)*k/4, y=Y(v); s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${(Math.round(v/100)/10).toString().replace(".",",")} k$</text>`; }
    if(mn<0) s+=`<line x1="${pl}" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-3)"/>`;
    defs.forEach(d=>{ const pts=T.map((m,i)=>[i,d.f(m)]).filter(p=>p[1]!==null&&p[1]!==undefined);
      s+=`<polyline fill="none" stroke="${d.c}" stroke-width="2.2" points="${pts.map(([i,v])=>X(i)+","+Y(v)).join(" ")}"/>`;
      pts.forEach(([i,v])=>s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="${d.c}"><title>${esc(T[i].nom)} – ${d.n} : ${$$(v)}</title></circle>`); });
    const pas = W < 500 ? 3 : (T.length<=13 ? 1 : 2);
    T.forEach((m,i)=>{ if(i%pas===0) s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(etiquette(m))}</text>`; });
    cible.innerHTML = s + "</svg>";
}
